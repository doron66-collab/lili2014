services:
  - type: web
    name: qcaihpc-simulation-api
    runtime: python
    region: oregon
    plan: starter
    # fpocket (geometric pocket detection, backend/routes/pocket.py) has no
    # apt/pip package. A precompiled x86_64 Linux binary is committed at
    # bin/fpocket (see bin/README.md) — that's what actually ships on a
    # normal deploy; `chmod +x` guards against the executable bit not
    # surviving however Render fetches the repo. The clone+make fallback
    # only fires if that binary is ever missing/non-executable (e.g. a
    # future architecture change) — not relied on by default, since this
    # environment has no way to confirm Render's build image has gcc/make.
    buildCommand: >-
      pip install -r requirements.txt &&
      mkdir -p bin && chmod +x bin/fpocket 2>/dev/null;
      (test -x bin/fpocket ||
        (rm -rf /tmp/fpocket_src &&
         git clone --depth 1 https://github.com/Discngine/fpocket.git /tmp/fpocket_src &&
         make -C /tmp/fpocket_src &&
         cp /tmp/fpocket_src/bin/fpocket bin/fpocket) || true)
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false   # set manually in Render dashboard
      - key: SUPABASE_KEY
        sync: false   # use service_role key (keep secret)
      - key: PYTHON_VERSION
        value: "3.11.0"
