<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 810" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#06b6d4"/>
    </marker>
    <marker id="aGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8A020"/>
    </marker>
    <marker id="aSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1140" height="810" fill="#ffffff"/>

  <text x="570" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0B1E3D">SOLANGE — Governed Job Lifecycle: Who Runs Where</text>
  <text x="570" y="52" text-anchor="middle" font-size="11" fill="#64748b">One quantum job from browser click to notarized record, mapped onto the infrastructure that actually hosts each step</text>

  <!-- ================= LANE A · WORKSTATION ================= -->
  <rect x="228" y="76" width="888" height="70" rx="8" fill="#f1f5f9" stroke="#0B1E3D" stroke-width="1.25"/>
  <text x="44" y="102" font-size="11" font-weight="700" fill="#0B1E3D">RESEARCHER'S</text>
  <text x="44" y="116" font-size="11" font-weight="700" fill="#0B1E3D">WORKSTATION</text>
  <text x="44" y="132" font-size="8.5" fill="#64748b">browser · UI served by Netlify</text>

  <rect x="248" y="88" width="300" height="46" rx="6" fill="#ffffff" stroke="#0B1E3D" stroke-width="1.25"/>
  <circle cx="265" cy="104" r="10" fill="#0B1E3D"/>
  <text x="265" y="108" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">1</text>
  <text x="282" y="107" font-size="10.5" font-weight="700" fill="#0B1E3D">Marks a mutation → “Queue for QPU”</text>
  <text x="256" y="125" font-size="8.5" fill="#334155">React UI from the Netlify CDN · signs in via Supabase Auth</text>

  <text x="578" y="99" font-size="8.5" font-weight="700" fill="#0e7490">The click writes one queued row —</text>
  <text x="578" y="111" font-size="8.5" fill="#0e7490">but only by asking Render to write it.</text>
  <text x="578" y="126" font-size="8.5" font-style="italic" fill="#64748b">The browser never touches a database table:</text>
  <text x="578" y="138" font-size="8.5" font-style="italic" fill="#64748b">Supabase is contacted for the login JWT and nothing else.</text>

  <!-- ================= LANE B · SOLANGE CLOUD ================= -->
  <rect x="228" y="170" width="888" height="210" rx="8" fill="#e0f2fe" stroke="#0B1E3D" stroke-width="1.25"/>
  <text x="44" y="252" font-size="11" font-weight="700" fill="#0B1E3D">SOLANGE CLOUD</text>
  <text x="44" y="267" font-size="9.5" fill="#334155">vendor-hosted</text>
  <text x="44" y="284" font-size="8.5" fill="#64748b">the only component the</text>
  <text x="44" y="296" font-size="8.5" fill="#64748b">outside world talks to</text>

  <!-- Render sub-zone -->
  <rect x="242" y="184" width="418" height="184" rx="6" fill="#ffffff" stroke="#0B1E3D" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="254" y="200" font-size="9.5" font-weight="700" fill="#0B1E3D">RENDER — FastAPI service</text>
  <text x="254" y="212" font-size="8" fill="#64748b">qcaihpc-simulation-api.onrender.com</text>

  <rect x="254" y="220" width="182" height="56" rx="5" fill="#f1f5f9" stroke="#06b6d4" stroke-width="1.25"/>
  <text x="264" y="237" font-size="9.5" font-weight="700" fill="#0B1E3D">Dispatch endpoints</text>
  <text x="264" y="252" font-size="8.5" fill="#334155">POST /hpc/dispatch — write</text>
  <text x="264" y="266" font-size="8.5" fill="#334155">GET /hpc/dispatch/next — claim</text>

  <rect x="448" y="220" width="200" height="136" rx="5" fill="#0B1E3D"/>
  <circle cx="465" cy="238" r="10" fill="#ffffff"/>
  <text x="465" y="242" text-anchor="middle" font-size="10" font-weight="700" fill="#0B1E3D">6</text>
  <text x="482" y="241" font-size="10.5" font-weight="700" fill="#f1f5f9">LEON</text>
  <text x="458" y="257" font-size="7.5" fill="#94a3b8">POST /hpc/submit — the one gate in</text>
  <text x="458" y="272" font-size="8.5" fill="#cbd5e1">Recomputes the P8 seal itself,</text>
  <text x="458" y="284" font-size="8.5" fill="#cbd5e1">compares it, and re-checks the</text>
  <text x="458" y="296" font-size="8.5" fill="#cbd5e1">physics-consistency invariant</text>
  <path d="M460,308 l3.5,4 l7,-8.5" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="474" y="312" font-size="8" fill="#86efac">pass → simulation_runs + audit</text>
  <path d="M460,322 l7,7 M467,322 l-7,7" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <text x="474" y="330" font-size="8" fill="#fca5a5">fail → 422, never stored (audited)</text>
  <text x="458" y="348" font-size="8.5" font-style="italic" font-weight="700" fill="#E8A020">verify, don't trust</text>

  <!-- Render <-> Supabase -->
  <line x1="662" y1="250" x2="698" y2="250" stroke="#64748b" stroke-width="1.5" marker-end="url(#aSlate)" marker-start="url(#aSlate)"/>

  <!-- Supabase sub-zone -->
  <rect x="700" y="184" width="402" height="184" rx="6" fill="#ffffff" stroke="#0B1E3D" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="712" y="200" font-size="9.5" font-weight="700" fill="#0B1E3D">SUPABASE — Postgres + Auth</text>
  <text x="712" y="212" font-size="8" fill="#64748b">reachable only from Render — never from the browser, never from an agent</text>

  <rect x="712" y="220" width="184" height="44" rx="5" fill="#f1f5f9" stroke="#0B1E3D" stroke-width="1"/>
  <text x="722" y="236" font-size="9" font-weight="700" fill="#0B1E3D">hpc_dispatch</text>
  <text x="722" y="250" font-size="8" fill="#334155">the queue — queued → running → done</text>

  <rect x="906" y="220" width="184" height="44" rx="5" fill="#f1f5f9" stroke="#0B1E3D" stroke-width="1"/>
  <text x="916" y="236" font-size="9" font-weight="700" fill="#0B1E3D">simulation_runs</text>
  <text x="916" y="250" font-size="8" fill="#334155">the sealed P1–P9 records</text>

  <rect x="712" y="274" width="184" height="44" rx="5" fill="#f1f5f9" stroke="#22c55e" stroke-width="1.25"/>
  <text x="722" y="290" font-size="9" font-weight="700" fill="#0B1E3D">leon_audit</text>
  <text x="722" y="304" font-size="8" fill="#334155">append-only — every verdict, incl. rejections</text>

  <rect x="906" y="274" width="184" height="44" rx="5" fill="#f1f5f9" stroke="#0B1E3D" stroke-width="1"/>
  <text x="916" y="290" font-size="9" font-weight="700" fill="#0B1E3D">Auth</text>
  <text x="916" y="304" font-size="8" fill="#334155">issues the browser's login JWT only</text>

  <text x="712" y="338" font-size="8" font-style="italic" fill="#64748b">Every write above is made by Render on the caller's behalf — the tables have no</text>
  <text x="712" y="350" font-size="8" font-style="italic" fill="#64748b">externally reachable surface of their own.</text>

  <!-- ================= LANE C · LAGUNA ================= -->
  <rect x="228" y="412" width="888" height="176" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.25" stroke-dasharray="6,4"/>
  <text x="44" y="480" font-size="11" font-weight="700" fill="#0B1E3D">USC CARC — LAGUNA</text>
  <text x="44" y="496" font-size="9.5" fill="#334155">the researcher's own</text>
  <text x="44" y="509" font-size="9.5" fill="#334155">authenticated terminal</text>
  <text x="44" y="525" font-size="8.5" fill="#64748b">OnDemand shell / JupyterLab</text>
  <text x="44" y="538" font-size="8.5" font-weight="700" fill="#64748b">interactive 2FA · no inbound path</text>

  <text x="248" y="434" font-size="8.5" font-weight="700" fill="#64748b">INSTITUTIONAL SECURITY PERIMETER — one live process: python scripts/laguna/solange_qpu.py --agent</text>

  <!-- (2) claim -->
  <rect x="300" y="444" width="288" height="126" rx="6" fill="#ffffff" stroke="#06b6d4" stroke-width="1.5"/>
  <circle cx="317" cy="462" r="10" fill="#0B1E3D"/>
  <text x="317" y="466" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">2</text>
  <text x="334" y="465" font-size="10.5" font-weight="700" fill="#0B1E3D">Claims the job (PULL)</text>
  <text x="312" y="484" font-size="8.5" fill="#334155">Polls Render every 15 s over an</text>
  <text x="312" y="497" font-size="8.5" fill="#334155">outbound HTTPS request, then claims</text>
  <text x="312" y="510" font-size="8.5" fill="#334155">the row → running</text>
  <text x="312" y="529" font-size="8" font-style="italic" fill="#0e7490">Builds the circuit from its OWN local file</text>
  <text x="312" y="541" font-size="8" font-style="italic" fill="#0e7490">~/lili2014/jw_hamiltonians.json —</text>
  <text x="312" y="553" font-size="8" font-style="italic" font-weight="700" fill="#0e7490">no scientific payload crosses inward</text>

  <!-- (5) seal -->
  <rect x="646" y="444" width="288" height="126" rx="6" fill="#ffffff" stroke="#06b6d4" stroke-width="1.5"/>
  <circle cx="663" cy="462" r="10" fill="#0B1E3D"/>
  <text x="663" y="466" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">5</text>
  <text x="680" y="465" font-size="10.5" font-weight="700" fill="#0B1E3D">Seals the record</text>
  <text x="658" y="484" font-size="8.5" fill="#334155">Assembles the P1–P9 provenance</text>
  <text x="658" y="497" font-size="8.5" fill="#334155">record and computes the P8 seal</text>
  <text x="658" y="510" font-size="8.5" font-weight="700" fill="#0B1E3D">here — on Laguna, where the</text>
  <text x="658" y="523" font-size="8.5" font-weight="700" fill="#0B1E3D">computation actually happened</text>
  <text x="658" y="542" font-size="8" font-style="italic" fill="#0e7490">then pushes it outbound to Render</text>

  <!-- ================= LANE D · IBM ================= -->
  <rect x="228" y="624" width="888" height="96" rx="8" fill="#fffbeb" stroke="#E8A020" stroke-width="1.25"/>
  <text x="44" y="662" font-size="11" font-weight="700" fill="#0B1E3D">IBM QUANTUM</text>
  <text x="44" y="677" font-size="9.5" fill="#334155">external vendor cloud</text>
  <text x="44" y="692" font-size="8.5" fill="#64748b">Heron QPU · ibm_fez / marrakesh</text>

  <rect x="470" y="640" width="330" height="64" rx="6" fill="#ffffff" stroke="#E8A020" stroke-width="1.5"/>
  <circle cx="487" cy="658" r="10" fill="#0B1E3D"/>
  <text x="487" y="662" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">4</text>
  <text x="504" y="661" font-size="10.5" font-weight="700" fill="#0B1E3D">The circuit executes</text>
  <text x="482" y="680" font-size="8.5" fill="#334155">Heron runs it and returns the measured</text>
  <text x="482" y="693" font-size="8.5" fill="#334155">expectation value — real quantum time</text>

  <!-- ================= ARROWS ================= -->
  <!-- 1: browser -> Render dispatch endpoint -->
  <line x1="380" y1="134" x2="348" y2="218" stroke="#06b6d4" stroke-width="2" marker-end="url(#aTeal)"/>

  <!-- 2: agent -> Render (PULL) -->
  <line x1="404" y1="444" x2="370" y2="280" stroke="#06b6d4" stroke-width="2" marker-end="url(#aTeal)"/>
  <text x="248" y="394" font-size="8.5" font-weight="700" fill="#0e7490">PULL — outbound HTTPS,</text>
  <text x="248" y="405" font-size="8.5" fill="#0e7490">opened from inside the perimeter</text>
  <text x="424" y="405" font-size="8.5" fill="#0e7490">the job descriptor returns on that same connection</text>

  <!-- 3: agent -> IBM -->
  <line x1="466" y1="570" x2="530" y2="640" stroke="#E8A020" stroke-width="2" marker-end="url(#aGold)"/>
  <circle cx="498" cy="605" r="10" fill="#E8A020"/>
  <text x="498" y="609" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">3</text>
  <text x="452" y="600" text-anchor="end" font-size="8.5" font-weight="700" fill="#a16207">submits the circuit</text>
  <text x="452" y="612" text-anchor="end" font-size="8.5" fill="#a16207">(outbound)</text>

  <!-- 4 -> 5 -->
  <line x1="742" y1="640" x2="790" y2="570" stroke="#E8A020" stroke-width="2" marker-end="url(#aGold)"/>
  <text x="800" y="600" font-size="8.5" fill="#a16207">the result returns on the</text>
  <text x="800" y="612" font-size="8.5" fill="#a16207">agent's own connection</text>

  <!-- 5 -> LEON -->
  <line x1="700" y1="444" x2="592" y2="360" stroke="#06b6d4" stroke-width="2" marker-end="url(#aTeal)"/>
  <text x="716" y="394" font-size="8.5" font-weight="700" fill="#0e7490">PUSH — the sealed P1–P9 record,</text>
  <text x="716" y="405" font-size="8.5" fill="#0e7490">outbound, into the LEON gate</text>

  <!-- ================= FOOTNOTE ================= -->
  <line x1="228" y1="746" x2="1116" y2="746" stroke="#cbd5e1" stroke-width="1"/>
  <text x="228" y="766" font-size="10" font-weight="700" fill="#0B1E3D">DP2 — cross a security boundary without weakening it. &#160;·&#160; DP1 — verify, don't trust.</text>
  <text x="228" y="782" font-size="9" fill="#334155">Every connection touching Laguna is opened from inside it outward: SOLANGE stores no cluster credential and has no inbound path. Steps 2–5 run only while an agent process is alive in an</text>
  <text x="228" y="795" font-size="9" fill="#334155">authenticated session; absent one, work stays queued by design. The seal is computed on Laguna and recomputed independently on Render — neither host relies on the other's word for it.</text>
</svg>
