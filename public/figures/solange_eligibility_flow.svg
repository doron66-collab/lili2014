<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1420" role="img" aria-label="Flowchart: a candidate mutation passes through six gates — mutation type, PDB structural coverage, active-electron count past the classical wall, existing druggability, measured S_max entanglement class, and current hardware reach — before becoming a prioritized SOLANGE-eligible candidate; each gate has a labeled exit branch for mutations that fail it, citing a real example found during the structural coverage audit.">
  <defs>
    <marker id="sef-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1040" height="1420" fill="#ffffff"/>

  <!-- ============ START ============ -->
  <rect x="180" y="14" width="400" height="64" rx="10" fill="none" stroke="#111111" stroke-width="1.6"/>
  <text x="380" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#111111">CANDIDATE MUTATION</text>
  <text x="380" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#444444">gene + variant — NGS, COSMIC, or literature hotspot</text>
  <line x1="380" y1="78" x2="380" y2="112" stroke="#111111" stroke-width="1.4" marker-end="url(#sef-arrow)"/>

  <!-- ============ GATE 1: mutation type ============ -->
  <rect x="160" y="112" width="440" height="72" rx="10" fill="none" stroke="#111111" stroke-width="1.6"/>
  <text x="380" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#111111">Is it a point / missense mutation?</text>
  <text x="380" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#444444">one residue, one substitution — not frameshift, nonsense, or splice</text>
  <text x="380" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#444444">truncation leaves no single residue to anchor a space to</text>

  <line x1="380" y1="184" x2="380" y2="218" stroke="#111111" stroke-width="1.4" marker-end="url(#sef-arrow)"/>
  <text x="392" y="204" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#0a7a0a">yes</text>

  <line x1="600" y1="148" x2="742" y2="148" stroke="#a31414" stroke-width="1.4" marker-end="url(#sef-arrow)"/>
  <text x="612" y="141" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#a31414">no</text>
  <rect x="742" y="106" width="270" height="86" rx="10" fill="#fdf0f0" stroke="#a31414" stroke-width="1.4"/>
  <text x="877" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#a31414">EXITS — no anchor residue</text>
  <text x="877" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#444444">frameshift / nonsense / splice garbles</text>
  <text x="877" y="161" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#444444">everything downstream of the site</text>
  <text x="877" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666666">e.g. KEAP1 LOF, RB1, ATRX (all frameshift)</text>

  <!-- ============ GATE 2: PDB coverage ============ -->
  <rect x="160" y="218" width="440" height="82" rx="10" fill="none" stroke="#111111" stroke-width="1.6"/>
  <text x="380" y="246" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#111111">Does a cited PDB structure resolve</text>
  <text x="380" y="263" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#111111">this exact residue?</text>
  <text x="380" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#444444">checked against the structure's own resolved range — not just a citation</text>

  <line x1="380" y1="300" x2="380" y2="334" stroke="#111111" stroke-width="1.4" marker-end="url(#sef-arrow)"/>
  <text x="392" y="320" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#0a7a0a">yes</text>

  <line x1="600" y1="259" x2="742" y2="259" stroke="#a31414" stroke-width="1.4" marker-end="url(#sef-arrow)"/>
  <text x="612" y="252" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#a31414">no</text>
  <rect x="742" y="217" width="270" height="86" rx="10" fill="#fdf0f0" stroke="#a31414" stroke-width="1.4"/>
  <text x="877" y="239" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#a31414">EXITS — unresolved / IDR</text>
  <text x="877" y="257" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#444444">residue sits outside the crystallized</text>
  <text x="877" y="272" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#444444">domain, often a flexible linker</text>
  <text x="877" y="291" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666666">e.g. KEAP1 R320Q, STK11 F354L, U2AF1 S34F</text>

  <!-- ============ PROCESS: measure electrons ============ -->
  <rect x="160" y="334" width="440" height="62" rx="10" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="380" y="359" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111111">Build the real active space (AVAS on the resolved site)</text>
  <text x="380" y="378" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#444444">turns "~44e, estimated" into a measured active-electron count</text>
  <line x1="380" y1="396" x2="380" y2="424" stroke="#111111" stroke-width="1.4" marker-end="url(#sef-arrow)"/>

  <!-- ============ GATE 3: classical wall ============ -->
  <rect x="160" y="424" width="440" height="72" rx="10" fill="none" stroke="#111111" stroke-width="1.6"/>
  <text x="380" y="452" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#111111">More than ~18 active electrons?</text>
  <text x="380" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#444444">the exact-classical-diagonalization wall — CCSD(T) reaches</text>
  <text x="380" y="486" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#444444">chemical accuracy on its own below this, regardless of entanglement</text>

  <line x1="380" y1="496" x2="380" y2="530" stroke="#111111" stroke-width="1.4" marker-end="url(#sef-arrow)"/>
  <text x="392" y="516" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#0a7a0a">yes</text>

  <line x1="600" y1="460" x2="742" y2="460" stroke="#a31414" stroke-width="1.4" marker-end="url(#sef-arrow)"/>
  <text x="612" y="453" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#a31414">no</text>
  <rect x="742" y="424" width="270" height="72" rx="10" fill="#fdf0f0" stroke="#a31414" stroke-width="1.4"/>
  <text x="877" y="447" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#a31414">EXITS — Class C</text>
  <text x="877" y="465" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#444444">classically sufficient on its own;</text>
  <text x="877" y="481" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#444444">filtered out of the quantum queue</text>

  <!-- ============ GATE 4: already druggable ============ -->
  <rect x="160" y="530" width="440" height="72" rx="10" fill="none" stroke="#111111" stroke-width="1.6"/>
  <text x="380" y="558" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#111111">Already druggable?</text>
  <text x="380" y="576" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#444444">an approved or late-phase small-molecule already restores</text>
  <text x="380" y="592" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#444444">or targets this mutant — independent of computational hardness</text>

  <line x1="380" y1="602" x2="380" y2="636" stroke="#111111" stroke-width="1.4" marker-end="url(#sef-arrow)"/>
  <text x="392" y="622" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#0a7a0a">no</text>

  <line x1="600" y1="566" x2="742" y2="566" stroke="#a31414" stroke-width="1.4" marker-end="url(#sef-arrow)"/>
  <text x="605" y="559" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#a31414">yes</text>
  <rect x="742" y="530" width="270" height="72" rx="10" fill="#fdf0f0" stroke="#a31414" stroke-width="1.4"/>
  <text x="877" y="553" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#a31414">EXITS — already solved</text>
  <text x="877" y="571" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#444444">demonstrating quantum necessity here</text>
  <text x="877" y="587" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666666">e.g. TP53 Y220C — Rezatapopt, Phase II</text>

  <!-- ============ PROCESS: measure S_max ============ -->
  <rect x="160" y="636" width="440" height="62" rx="10" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="380" y="661" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111111">Measure S_max (real DMRG CAS-ladder run)</text>
  <text x="380" y="680" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#444444">turns a "size prior" into a measured entanglement class</text>

  <line x1="300" y1="698" x2="240" y2="740" stroke="#111111" stroke-width="1.4" marker-end="url(#sef-arrow)"/>
  <line x1="460" y1="698" x2="520" y2="740" stroke="#111111" stroke-width="1.4" marker-end="url(#sef-arrow)"/>

  <!-- ============ SPLIT: Class B vs Class A ============ -->
  <rect x="90" y="740" width="300" height="72" rx="10" fill="#f0f8f0" stroke="#0a7a0a" stroke-width="1.4"/>
  <text x="240" y="765" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0a7a0a">S_max saturates (area law)</text>
  <text x="240" y="782" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#444444">→ Class B — quantum-advantaged,</text>
  <text x="240" y="798" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#444444">DMRG itself suffices</text>

  <rect x="420" y="740" width="300" height="72" rx="10" fill="#f0f8f0" stroke="#0a7a0a" stroke-width="1.4"/>
  <text x="570" y="765" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0a7a0a">S_max keeps climbing (volume law)</text>
  <text x="570" y="782" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#444444">→ Class A — quantum-necessary,</text>
  <text x="570" y="798" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#444444">even DMRG fails</text>

  <line x1="240" y1="812" x2="360" y2="850" stroke="#111111" stroke-width="1.4" marker-end="url(#sef-arrow)"/>
  <line x1="570" y1="812" x2="420" y2="850" stroke="#111111" stroke-width="1.4" marker-end="url(#sef-arrow)"/>

  <!-- ============ GATE 5: hardware reach ============ -->
  <rect x="160" y="850" width="440" height="72" rx="10" fill="none" stroke="#111111" stroke-width="1.6"/>
  <text x="380" y="878" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#111111">Does the qubit footprint fit today's hardware?</text>
  <text x="380" y="896" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#444444">full-site qubit count vs. current device capacity</text>
  <text x="380" y="912" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666666">e.g. IBM Heron r3, ~156q</text>

  <line x1="300" y1="922" x2="240" y2="964" stroke="#111111" stroke-width="1.4" marker-end="url(#sef-arrow)"/>
  <line x1="460" y1="922" x2="520" y2="964" stroke="#111111" stroke-width="1.4" marker-end="url(#sef-arrow)"/>
  <text x="205" y="948" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#0a7a0a">yes</text>
  <text x="530" y="948" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#444444">no</text>

  <rect x="90" y="964" width="300" height="58" rx="10" fill="none" stroke="#111111" stroke-width="1.4"/>
  <text x="240" y="988" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111111">hardware_era: current</text>
  <text x="240" y="1005" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#444444">e.g. TP53 C275F, 88q</text>

  <rect x="420" y="964" width="300" height="58" rx="10" fill="none" stroke="#111111" stroke-width="1.4"/>
  <text x="570" y="988" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111111">hardware_era: fault_tolerant</text>
  <text x="570" y="1005" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#444444">e.g. KEAP1 G333C, 208q — ~2030+</text>

  <line x1="240" y1="1022" x2="360" y2="1060" stroke="#111111" stroke-width="1.4" marker-end="url(#sef-arrow)"/>
  <line x1="570" y1="1022" x2="420" y2="1060" stroke="#111111" stroke-width="1.4" marker-end="url(#sef-arrow)"/>

  <!-- ============ END: eligible ============ -->
  <rect x="140" y="1060" width="480" height="96" rx="12" fill="#f0f8f0" stroke="#0a7a0a" stroke-width="1.8"/>
  <text x="380" y="1088" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#0a7a0a">SOLANGE-ELIGIBLE CANDIDATE</text>
  <text x="380" y="1108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#444444">tagged: class (A/B) · hardware era · measured active-e / qubits</text>
  <text x="380" y="1125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#444444">· annual patient burden</text>
  <text x="380" y="1144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#666666">ten mutations clear every gate as of 2026-08-12 (Table 1b)</text>

  <line x1="380" y1="1156" x2="380" y2="1190" stroke="#111111" stroke-width="1.4" marker-end="url(#sef-arrow)"/>

  <rect x="130" y="1190" width="500" height="66" rx="10" fill="none" stroke="#111111" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="380" y="1216" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111111">Prioritized candidate list</text>
  <text x="380" y="1236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#444444">sorted by annual patient burden — urgency, not just eligibility</text>
</svg>
