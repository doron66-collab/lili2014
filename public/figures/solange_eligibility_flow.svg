<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 1980" role="img" aria-label="Flowchart: a candidate mutation passes through seven gates — mutation type, PDB structural position coverage, deposited-residue identity match (new), active-electron count past the classical wall, existing druggability, measured S_max entanglement class, and current hardware reach — before becoming a prioritized SOLANGE-eligible candidate; each gate has a labeled exit branch for mutations that fail it, citing a real example found during the structural coverage audit.">
  <rect x="0" y="0" width="1460" height="1980" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a31414"/>
    </marker>
  </defs>

  <!-- box 1: candidate -->
  <rect x="290" y="10" width="520" height="70" rx="10" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text x="550" y="38" text-anchor="middle" font-weight="700" font-size="15">CANDIDATE MUTATION</text>
  <text x="550" y="58" text-anchor="middle" font-size="11.5" fill="#444">gene + variant — NGS, COSMIC, or literature hotspot</text>
  <line x1="550" y1="80" x2="550" y2="115" stroke="#111" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- box 2: point mutation -->
  <rect x="255" y="115" width="590" height="80" rx="10" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text x="550" y="143" text-anchor="middle" font-weight="700" font-size="14.5">Is it a point / missense mutation?</text>
  <text x="550" y="163" text-anchor="middle" font-size="11" fill="#444">one residue, one substitution — not frameshift, nonsense, or splice</text>
  <text x="550" y="178" text-anchor="middle" font-size="11" fill="#444">truncation leaves no single residue to anchor a space to</text>
  <line x1="845" y1="155" x2="1015" y2="155" stroke="#a31414" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <text x="880" y="147" font-size="11.5" fill="#a31414" font-weight="700">no</text>
  <rect x="1020" y="118" width="410" height="76" rx="6" fill="#fdecec" stroke="#a31414" stroke-width="1.3"/>
  <text x="1225" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#a31414">EXITS — no anchor residue</text>
  <text x="1225" y="156" text-anchor="middle" font-size="10.5" fill="#333">frameshift / nonsense / splice garbles everything downstream</text>
  <text x="1225" y="171" text-anchor="middle" font-size="10" fill="#777">e.g. KEAP1 LOF, RB1, ATRX (all frameshift)</text>
  <text x="565" y="212" font-size="11.5" fill="#0a7a0a" font-weight="700">yes</text>
  <line x1="550" y1="195" x2="550" y2="235" stroke="#111" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- box 3: PDB position resolved -->
  <rect x="255" y="235" width="590" height="82" rx="10" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text x="550" y="262" text-anchor="middle" font-weight="700" font-size="14.5">Does a cited PDB structure resolve</text>
  <text x="550" y="280" text-anchor="middle" font-weight="700" font-size="14.5">this exact residue's POSITION?</text>
  <text x="550" y="300" text-anchor="middle" font-size="11" fill="#444">checked against the structure's own resolved range — not just a citation</text>
  <line x1="845" y1="276" x2="1015" y2="276" stroke="#a31414" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <text x="880" y="268" font-size="11.5" fill="#a31414" font-weight="700">no</text>
  <rect x="1020" y="238" width="410" height="80" rx="6" fill="#fdecec" stroke="#a31414" stroke-width="1.3"/>
  <text x="1225" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#a31414">EXITS — unresolved / IDR</text>
  <text x="1225" y="276" text-anchor="middle" font-size="10.5" fill="#333">residue sits outside the crystallized domain,</text>
  <text x="1225" y="291" text-anchor="middle" font-size="10.5" fill="#333">often a flexible linker</text>
  <text x="1225" y="308" text-anchor="middle" font-size="10" fill="#777">e.g. KEAP1 R320Q, STK11 F354L, U2AF1 S34F</text>
  <text x="565" y="335" font-size="11.5" fill="#0a7a0a" font-weight="700">yes</text>
  <line x1="550" y1="317" x2="550" y2="358" stroke="#111" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- NEW box 3b: residue identity -->
  <rect x="255" y="358" width="590" height="92" rx="10" fill="#fff8e8" stroke="#a36a00" stroke-width="1.8"/>
  <text x="550" y="382" text-anchor="middle" font-weight="700" font-size="14.5" fill="#7a5200">NEW — Does the deposited residue's IDENTITY</text>
  <text x="550" y="400" text-anchor="middle" font-weight="700" font-size="14.5" fill="#7a5200">match what the position claims (WT or mutant)?</text>
  <text x="550" y="418" text-anchor="middle" font-size="11" fill="#5a4000">checked via the structure's own SEQADV record — position ≠ identity;</text>
  <text x="550" y="433" text-anchor="middle" font-size="11" fill="#5a4000">engineered crystallization constructs (kinase-dead, etc.) can occupy the same position</text>
  <line x1="845" y1="404" x2="1015" y2="404" stroke="#a31414" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <text x="880" y="396" font-size="11.5" fill="#a31414" font-weight="700">no</text>
  <rect x="1020" y="362" width="410" height="84" rx="6" fill="#fdecec" stroke="#a31414" stroke-width="1.3"/>
  <text x="1225" y="382" text-anchor="middle" font-size="12" font-weight="700" fill="#a31414">EXITS — identity mismatch</text>
  <text x="1225" y="400" text-anchor="middle" font-size="10.5" fill="#333">position covered, but the actual residue there</text>
  <text x="1225" y="415" text-anchor="middle" font-size="10.5" fill="#333">is not the WT or mutant claimed</text>
  <text x="1225" y="432" text-anchor="middle" font-size="10" fill="#777">e.g. SMARCA4 T910M (Gly, not Thr); flagged, not silently used</text>
  <text x="565" y="467" font-size="11.5" fill="#0a7a0a" font-weight="700">yes / WT-approximation noted</text>
  <line x1="550" y1="450" x2="550" y2="490" stroke="#111" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- box 4 (dashed): build AVAS -->
  <rect x="255" y="490" width="590" height="96" rx="10" fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="550" y="514" text-anchor="middle" font-weight="700" font-size="14.5">Build the real active space (AVAS on the resolved site)</text>
  <text x="550" y="534" text-anchor="middle" font-size="11" fill="#444">turns "~44e, estimated" into a REAL COMPUTED RANGE —</text>
  <text x="550" y="549" text-anchor="middle" font-size="11" fill="#444">not a single number: depends on which orbitals are targeted</text>
  <text x="550" y="564" text-anchor="middle" font-size="11" fill="#a36a00" font-weight="700">final criterion still needs a computational chemist's sign-off</text>
  <line x1="550" y1="586" x2="550" y2="622" stroke="#111" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- box 5: >18e -->
  <rect x="255" y="622" width="590" height="80" rx="10" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text x="550" y="650" text-anchor="middle" font-weight="700" font-size="14.5">More than ~18 active electrons?</text>
  <text x="550" y="670" text-anchor="middle" font-size="11" fill="#444">the exact-classical-diagonalization wall — CCSD(T) reaches</text>
  <text x="550" y="685" text-anchor="middle" font-size="11" fill="#444">chemical accuracy on its own below this, regardless of entanglement</text>
  <line x1="845" y1="660" x2="1015" y2="660" stroke="#a31414" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <text x="880" y="652" font-size="11.5" fill="#a31414" font-weight="700">no</text>
  <rect x="1020" y="625" width="410" height="66" rx="6" fill="#fdecec" stroke="#a31414" stroke-width="1.3"/>
  <text x="1225" y="650" text-anchor="middle" font-size="12" font-weight="700" fill="#a31414">EXITS — Class C</text>
  <text x="1225" y="668" text-anchor="middle" font-size="10.5" fill="#333">classically sufficient on its own; filtered out of the quantum queue</text>
  <text x="565" y="719" font-size="11.5" fill="#0a7a0a" font-weight="700">yes</text>
  <line x1="550" y1="702" x2="550" y2="742" stroke="#111" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- box 6: druggable -->
  <rect x="255" y="742" width="590" height="82" rx="10" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text x="550" y="770" text-anchor="middle" font-weight="700" font-size="14.5">Already druggable?</text>
  <text x="550" y="790" text-anchor="middle" font-size="11" fill="#444">an approved or late-phase small-molecule already restores</text>
  <text x="550" y="805" text-anchor="middle" font-size="11" fill="#444">or targets this mutant — independent of computational hardness</text>
  <line x1="845" y1="783" x2="1015" y2="783" stroke="#a31414" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <text x="875" y="775" font-size="11.5" fill="#a31414" font-weight="700">yes</text>
  <rect x="1020" y="745" width="410" height="76" rx="6" fill="#fdecec" stroke="#a31414" stroke-width="1.3"/>
  <text x="1225" y="765" text-anchor="middle" font-size="12" font-weight="700" fill="#a31414">EXITS — already solved</text>
  <text x="1225" y="783" text-anchor="middle" font-size="10.5" fill="#333">not evidence of quantum necessity here</text>
  <text x="1225" y="800" text-anchor="middle" font-size="10" fill="#777">e.g. TP53 Y220C — Rezatapopt, Phase II</text>
  <text x="565" y="840" font-size="11.5" fill="#0a7a0a" font-weight="700">no</text>
  <line x1="550" y1="824" x2="550" y2="864" stroke="#111" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- box 7 (dashed): measure Smax -->
  <rect x="255" y="864" width="590" height="80" rx="10" fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="550" y="892" text-anchor="middle" font-weight="700" font-size="14.5">Measure S_max (real DMRG CAS-ladder run)</text>
  <text x="550" y="912" text-anchor="middle" font-size="11" fill="#444">turns a "size prior" into a measured entanglement class</text>
  <text x="550" y="930" text-anchor="middle" font-size="11" fill="#a36a00" font-weight="700">on THIS setup's active space — not yet a chemist-approved one</text>
  <line x1="550" y1="944" x2="420" y2="985" stroke="#111" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="550" y1="944" x2="680" y2="985" stroke="#111" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- box 8a: saturates -->
  <rect x="150" y="985" width="400" height="90" rx="8" fill="#eaf7ea" stroke="#0a7a0a" stroke-width="1.6"/>
  <text x="350" y="1010" text-anchor="middle" font-weight="700" font-size="13.5" fill="#0a5c0a">S_max saturates (area law)</text>
  <text x="350" y="1030" text-anchor="middle" font-size="11" fill="#1a3d1a">→ Class B — quantum-advantaged,</text>
  <text x="350" y="1045" text-anchor="middle" font-size="11" fill="#1a3d1a">DMRG itself suffices</text>
  <text x="350" y="1063" text-anchor="middle" font-size="10" fill="#4a6a4a">threshold itself is a calibrated policy, not a law of nature</text>

  <!-- box 8b: climbing -->
  <rect x="560" y="985" width="400" height="90" rx="8" fill="#eaf7ea" stroke="#0a7a0a" stroke-width="1.6"/>
  <text x="760" y="1010" text-anchor="middle" font-weight="700" font-size="13.5" fill="#0a5c0a">S_max keeps climbing (volume law)</text>
  <text x="760" y="1030" text-anchor="middle" font-size="11" fill="#1a3d1a">→ Class A — quantum-necessary,</text>
  <text x="760" y="1045" text-anchor="middle" font-size="11" fill="#1a3d1a">even DMRG fails</text>
  <text x="760" y="1063" text-anchor="middle" font-size="10" fill="#4a6a4a">re-calibrate against THIS system, not a borrowed reference</text>

  <line x1="350" y1="1075" x2="550" y2="1110" stroke="#111" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="760" y1="1075" x2="550" y2="1110" stroke="#111" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- box 9: fits hardware -->
  <rect x="255" y="1110" width="590" height="72" rx="10" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text x="550" y="1136" text-anchor="middle" font-weight="700" font-size="14.5">Does the qubit footprint fit today's hardware?</text>
  <text x="550" y="1155" text-anchor="middle" font-size="11" fill="#444">full-site qubit count vs. current device capacity</text>
  <text x="550" y="1170" text-anchor="middle" font-size="10.5" fill="#777">e.g. IBM Heron r3, ~156q</text>
  <line x1="420" y1="1182" x2="330" y2="1218" stroke="#0a7a0a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="330" y="1204" text-anchor="middle" font-size="11.5" fill="#0a7a0a" font-weight="700">yes</text>
  <line x1="680" y1="1182" x2="770" y2="1218" stroke="#111" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="770" y="1204" text-anchor="middle" font-size="11.5" font-weight="700">no</text>

  <rect x="150" y="1222" width="400" height="60" rx="8" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text x="350" y="1248" text-anchor="middle" font-weight="700" font-size="13">hardware_era: current</text>
  <text x="350" y="1266" text-anchor="middle" font-size="10.5" fill="#555">e.g. TP53 C275F, 24–56q (measured range)</text>

  <rect x="560" y="1222" width="400" height="60" rx="8" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text x="760" y="1248" text-anchor="middle" font-weight="700" font-size="13">hardware_era: fault_tolerant</text>
  <text x="760" y="1266" text-anchor="middle" font-size="10.5" fill="#555">e.g. KEAP1 G333C, ~310q — ~2030+</text>

  <line x1="350" y1="1282" x2="550" y2="1318" stroke="#111" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="760" y1="1282" x2="550" y2="1318" stroke="#111" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="230" y="1318" width="640" height="96" rx="10" fill="#eaf7ea" stroke="#0a5c0a" stroke-width="1.8"/>
  <text x="550" y="1345" text-anchor="middle" font-weight="700" font-size="15.5" fill="#0a5c0a">SOLANGE-ELIGIBLE CANDIDATE</text>
  <text x="550" y="1365" text-anchor="middle" font-size="11" fill="#1a3d1a">tagged: class (A/B/C, measured or provisional) · hardware era ·</text>
  <text x="550" y="1380" text-anchor="middle" font-size="11" fill="#1a3d1a">AVAS-tested range (not a single value) · annual patient burden</text>
  <text x="550" y="1400" text-anchor="middle" font-size="10" fill="#4a6a4a">nine mutations pass gates 1–4 as of August 12, 2026 (Table 1b); only C275F carries a completed S_max measurement, added August 14, 2026</text>

  <line x1="550" y1="1414" x2="550" y2="1450" stroke="#111" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="230" y="1450" width="640" height="60" rx="8" fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="550" y="1476" text-anchor="middle" font-weight="700" font-size="13">Prioritized candidate list</text>
  <text x="550" y="1494" text-anchor="middle" font-size="10.5" fill="#555">sorted by annual patient burden — urgency, not just eligibility</text>

  <text x="550" y="1550" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">Updated August 14, 2026: adds the residue-identity gate and reframes AVAS/S_max as measurements on THIS session's setup, not a chemist-approved one.</text>
</svg>
