<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="bTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#06b6d4"/>
    </marker>
    <marker id="bViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="bSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1140" height="800" fill="#ffffff"/>

  <text x="570" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0B1E3D">SOLANGE — DMRG Classification Lifecycle (Rung 3): Who Runs Where</text>
  <text x="570" y="52" text-anchor="middle" font-size="11" fill="#64748b">The classical A/B/C classifier — the rung that decides whether a quantum run is warranted at all. No external vendor: it never leaves the institution.</text>

  <!-- ================= LANE A · WORKSTATION ================= -->
  <rect x="228" y="76" width="888" height="92" rx="8" fill="#f1f5f9" stroke="#0B1E3D" stroke-width="1.25"/>
  <text x="44" y="106" font-size="11" font-weight="700" fill="#0B1E3D">RESEARCHER'S</text>
  <text x="44" y="120" font-size="11" font-weight="700" fill="#0B1E3D">WORKSTATION</text>
  <text x="44" y="136" font-size="8.5" fill="#64748b">browser + local structure prep</text>

  <rect x="248" y="88" width="300" height="66" rx="6" fill="#ffffff" stroke="#0B1E3D" stroke-width="1.25"/>
  <circle cx="265" cy="106" r="10" fill="#0B1E3D"/>
  <text x="265" y="110" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">1</text>
  <text x="282" y="109" font-size="10.5" font-weight="700" fill="#0B1E3D">Marks a mutation → “Queue DMRG”</text>
  <text x="256" y="127" font-size="8.5" fill="#334155">React UI from the Netlify CDN · job_type = dmrg</text>
  <text x="256" y="141" font-size="8.5" font-weight="700" fill="#0e7490">The chosen CAS size is forwarded here — unlike the QPU rung</text>

  <rect x="580" y="88" width="510" height="66" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25" stroke-dasharray="3,3"/>
  <text x="592" y="106" font-size="9.5" font-weight="700" fill="#0B1E3D">Structure preparation — done here, before anything is queued</text>
  <text x="592" y="122" font-size="8.5" fill="#334155">RCSB PDB entry → hydrogens added (Open Babel) → build_qm_cluster.py → active-site cluster .xyz</text>
  <text x="592" y="137" font-size="8.5" font-style="italic" fill="#64748b">Uploaded straight to Laguna. SOLANGE never holds the geometry — the agent reads it from local disk.</text>

  <!-- ================= LANE B · SOLANGE CLOUD ================= -->
  <rect x="228" y="190" width="888" height="210" rx="8" fill="#e0f2fe" stroke="#0B1E3D" stroke-width="1.25"/>
  <text x="44" y="272" font-size="11" font-weight="700" fill="#0B1E3D">SOLANGE CLOUD</text>
  <text x="44" y="287" font-size="9.5" fill="#334155">vendor-hosted</text>
  <text x="44" y="304" font-size="8.5" fill="#64748b">the only component the</text>
  <text x="44" y="316" font-size="8.5" fill="#64748b">outside world talks to</text>

  <!-- Render sub-zone -->
  <rect x="242" y="204" width="418" height="184" rx="6" fill="#ffffff" stroke="#0B1E3D" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="254" y="220" font-size="9.5" font-weight="700" fill="#0B1E3D">RENDER — FastAPI service</text>
  <text x="254" y="232" font-size="8" fill="#64748b">qcaihpc-simulation-api.onrender.com</text>

  <rect x="254" y="240" width="182" height="56" rx="5" fill="#f1f5f9" stroke="#06b6d4" stroke-width="1.25"/>
  <text x="264" y="257" font-size="9.5" font-weight="700" fill="#0B1E3D">Dispatch endpoints</text>
  <text x="264" y="272" font-size="8.5" fill="#334155">POST /hpc/dispatch — write</text>
  <text x="264" y="286" font-size="8.5" fill="#334155">GET /hpc/dispatch/next — claim</text>

  <rect x="448" y="240" width="200" height="136" rx="5" fill="#0B1E3D"/>
  <circle cx="465" cy="258" r="10" fill="#ffffff"/>
  <text x="465" y="262" text-anchor="middle" font-size="10" font-weight="700" fill="#0B1E3D">6</text>
  <text x="482" y="261" font-size="10.5" font-weight="700" fill="#f1f5f9">LEON</text>
  <text x="458" y="277" font-size="7.5" fill="#94a3b8">POST /hpc/dmrg/submit — this rung's gate</text>
  <text x="458" y="292" font-size="8.5" fill="#cbd5e1">Recomputes the dmrg_hash seal</text>
  <text x="458" y="304" font-size="8.5" fill="#cbd5e1">over every field and compares.</text>
  <text x="458" y="316" font-size="8" fill="#94a3b8">Completeness + non-tampering only —</text>
  <text x="458" y="327" font-size="8" fill="#94a3b8">the physics invariant is specific to the</text>
  <text x="458" y="338" font-size="8" fill="#94a3b8">P1–P9 energy records, not to this one.</text>
  <path d="M460,348 l3.5,4 l7,-8.5" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="474" y="352" font-size="8" fill="#86efac">pass → dmrg_classifications</text>
  <path d="M460,360 l7,7 M467,360 l-7,7" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <text x="474" y="368" font-size="8" fill="#fca5a5">fail → 422, never stored (audited)</text>

  <!-- Render <-> Supabase -->
  <line x1="662" y1="270" x2="698" y2="270" stroke="#64748b" stroke-width="1.5" marker-end="url(#bSlate)" marker-start="url(#bSlate)"/>

  <!-- Supabase sub-zone -->
  <rect x="700" y="204" width="402" height="184" rx="6" fill="#ffffff" stroke="#0B1E3D" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="712" y="220" font-size="9.5" font-weight="700" fill="#0B1E3D">SUPABASE — Postgres + Auth</text>
  <text x="712" y="232" font-size="8" fill="#64748b">reachable only from Render — never from the browser, never from an agent</text>

  <rect x="712" y="240" width="184" height="44" rx="5" fill="#f1f5f9" stroke="#0B1E3D" stroke-width="1"/>
  <text x="722" y="256" font-size="9" font-weight="700" fill="#0B1E3D">hpc_dispatch</text>
  <text x="722" y="270" font-size="8" fill="#334155">the queue — shared with the HPC rung</text>

  <rect x="906" y="240" width="184" height="44" rx="5" fill="#f1f5f9" stroke="#7c3aed" stroke-width="1.25"/>
  <text x="916" y="256" font-size="9" font-weight="700" fill="#0B1E3D">dmrg_classifications</text>
  <text x="916" y="270" font-size="8" fill="#334155">the sealed A/B/C verdicts + S_max</text>

  <rect x="712" y="294" width="184" height="44" rx="5" fill="#f1f5f9" stroke="#22c55e" stroke-width="1.25"/>
  <text x="722" y="310" font-size="9" font-weight="700" fill="#0B1E3D">leon_audit</text>
  <text x="722" y="324" font-size="8" fill="#334155">append-only — every verdict, incl. rejections</text>

  <rect x="906" y="294" width="184" height="44" rx="5" fill="#f1f5f9" stroke="#0B1E3D" stroke-width="1"/>
  <text x="916" y="310" font-size="9" font-weight="700" fill="#0B1E3D">Auth</text>
  <text x="916" y="324" font-size="8" fill="#334155">issues the browser's login JWT only</text>

  <text x="712" y="358" font-size="8" font-style="italic" fill="#64748b">The verdict is re-attestable long after the fact: /hpc/dmrg/&#123;id&#125;/verify recomputes</text>
  <text x="712" y="370" font-size="8" font-style="italic" fill="#64748b">the same seal on demand, and that re-check is itself written to leon_audit.</text>

  <!-- ================= LANE C · LAGUNA ================= -->
  <rect x="228" y="430" width="888" height="280" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.25" stroke-dasharray="6,4"/>
  <text x="44" y="545" font-size="11" font-weight="700" fill="#0B1E3D">USC CARC — LAGUNA</text>
  <text x="44" y="561" font-size="9.5" fill="#334155">the researcher's own</text>
  <text x="44" y="574" font-size="9.5" fill="#334155">authenticated session</text>
  <text x="44" y="590" font-size="8.5" fill="#64748b">compute node · block2 + PySCF</text>
  <text x="44" y="603" font-size="8.5" font-weight="700" fill="#64748b">interactive 2FA · no inbound path</text>

  <text x="250" y="450" font-size="8.5" font-weight="700" fill="#64748b">INSTITUTIONAL SECURITY PERIMETER — the entire computation happens here; only the sealed verdict ever leaves</text>

  <!-- (2) claim -->
  <rect x="250" y="462" width="300" height="86" rx="6" fill="#ffffff" stroke="#06b6d4" stroke-width="1.5"/>
  <circle cx="267" cy="480" r="10" fill="#0B1E3D"/>
  <text x="267" y="484" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">2</text>
  <text x="284" y="483" font-size="10.5" font-weight="700" fill="#0B1E3D">Claims the job (PULL)</text>
  <text x="262" y="502" font-size="8.5" fill="#334155">The same classical agent serves both rungs —</text>
  <text x="262" y="515" font-size="8.5" fill="#334155">it asks for job_type = hpc,dmrg</text>
  <text x="262" y="533" font-size="8" font-style="italic" fill="#0e7490">python scripts/laguna/solange_hpc.py --agent</text>

  <!-- ALT entry -->
  <rect x="580" y="462" width="300" height="86" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.25" stroke-dasharray="4,3"/>
  <text x="592" y="481" font-size="10" font-weight="700" fill="#5b21b6">ALTERNATE ENTRY — sbatch</text>
  <text x="592" y="499" font-size="8.5" fill="#334155">Submitted by hand inside the same session:</text>
  <text x="592" y="512" font-size="8.5" fill="#334155">sbatch run_dmrg_geometry.sbatch</text>
  <text x="592" y="530" font-size="8" font-style="italic" font-weight="700" fill="#5b21b6">Skips the queue entirely — and still returns</text>
  <text x="592" y="542" font-size="8" font-style="italic" font-weight="700" fill="#5b21b6">through the very same LEON gate</text>

  <!-- (3) compute -->
  <rect x="250" y="566" width="300" height="126" rx="6" fill="#ffffff" stroke="#06b6d4" stroke-width="1.5"/>
  <circle cx="267" cy="584" r="10" fill="#0B1E3D"/>
  <text x="267" y="588" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">3</text>
  <text x="284" y="587" font-size="10.5" font-weight="700" fill="#0B1E3D">Runs the classical chain</text>
  <text x="262" y="606" font-size="8.5" fill="#334155">RHF (density-fitted) → AVAS selects the</text>
  <text x="262" y="619" font-size="8.5" fill="#334155">active space → CASSCF → DMRG swept</text>
  <text x="262" y="632" font-size="8.5" fill="#334155">over rising bond dimensions</text>
  <text x="262" y="651" font-size="8" font-style="italic" fill="#0e7490">Reads the cluster .xyz from local disk —</text>
  <text x="262" y="663" font-size="8" font-style="italic" fill="#0e7490">the geometry never crossed the network</text>
  <text x="262" y="681" font-size="8" fill="#64748b">block2 + PySCF, CPU · minutes to hours</text>

  <!-- (4) classify -->
  <rect x="580" y="566" width="250" height="126" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <circle cx="597" cy="584" r="10" fill="#0B1E3D"/>
  <text x="597" y="588" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">4</text>
  <text x="614" y="587" font-size="10.5" font-weight="700" fill="#0B1E3D">Classifies A / B / C</text>
  <text x="592" y="606" font-size="8" fill="#334155">S_max — the largest bipartite entanglement</text>
  <text x="592" y="618" font-size="8" fill="#334155">— is the physical evidence, not a size guess</text>
  <text x="592" y="637" font-size="8" fill="#166534">C — ≤18e: exact classical already suffices</text>
  <text x="592" y="650" font-size="8" fill="#a16207">B — DMRG converges, S_max &lt; 1.5</text>
  <text x="592" y="663" font-size="8" font-weight="700" fill="#991b1b">A — it does not: quantum-necessary</text>
  <text x="592" y="681" font-size="8" font-style="italic" fill="#64748b">the verdict carries its own written rationale</text>

  <!-- (5) seal -->
  <rect x="856" y="566" width="234" height="126" rx="6" fill="#ffffff" stroke="#06b6d4" stroke-width="1.5"/>
  <circle cx="873" cy="584" r="10" fill="#0B1E3D"/>
  <text x="873" y="588" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">5</text>
  <text x="890" y="587" font-size="10.5" font-weight="700" fill="#0B1E3D">Seals the verdict</text>
  <text x="868" y="606" font-size="8.5" fill="#334155">Computes dmrg_hash over the</text>
  <text x="868" y="619" font-size="8.5" fill="#334155">whole record — here on Laguna,</text>
  <text x="868" y="632" font-size="8.5" font-weight="700" fill="#0B1E3D">where the computation happened</text>
  <text x="868" y="651" font-size="8" font-style="italic" fill="#0e7490">then pushes it outbound to Render</text>
  <text x="868" y="669" font-size="8" fill="#64748b">The canonical sealed payload is stored</text>
  <text x="868" y="681" font-size="8" fill="#64748b">verbatim, so re-checks are exact.</text>

  <!-- ================= ARROWS ================= -->
  <!-- 1 -> dispatch endpoint -->
  <line x1="390" y1="154" x2="352" y2="238" stroke="#06b6d4" stroke-width="2" marker-end="url(#bTeal)"/>

  <!-- 2 -> dispatch endpoint (PULL) -->
  <line x1="400" y1="462" x2="374" y2="298" stroke="#06b6d4" stroke-width="2" marker-end="url(#bTeal)"/>
  <text x="250" y="414" font-size="8.5" font-weight="700" fill="#0e7490">PULL — outbound HTTPS,</text>
  <text x="250" y="425" font-size="8.5" fill="#0e7490">opened from inside the perimeter</text>
  <text x="424" y="425" font-size="8.5" fill="#0e7490">the job descriptor returns on that same connection</text>

  <!-- 2 -> 3 -->
  <line x1="400" y1="548" x2="400" y2="562" stroke="#06b6d4" stroke-width="2" marker-end="url(#bTeal)"/>
  <!-- ALT -> 3 -->
  <line x1="616" y1="548" x2="524" y2="562" stroke="#7c3aed" stroke-width="1.75" stroke-dasharray="4,3" marker-end="url(#bViolet)"/>

  <!-- 3 -> 4 -->
  <line x1="550" y1="629" x2="576" y2="629" stroke="#06b6d4" stroke-width="2" marker-end="url(#bTeal)"/>
  <!-- 4 -> 5 -->
  <line x1="830" y1="629" x2="852" y2="629" stroke="#06b6d4" stroke-width="2" marker-end="url(#bTeal)"/>

  <!-- 5 -> LEON : routed up the right, then left through the inter-lane gap -->
  <path d="M973,566 L973,414 L620,414 L620,382" fill="none" stroke="#06b6d4" stroke-width="2" marker-end="url(#bTeal)"/>
  <text x="700" y="408" font-size="8.5" font-weight="700" fill="#0e7490">PUSH — the sealed verdict, outbound, into the LEON gate</text>

  <!-- ================= FOOTNOTE ================= -->
  <line x1="228" y1="736" x2="1116" y2="736" stroke="#cbd5e1" stroke-width="1"/>
  <text x="228" y="756" font-size="10" font-weight="700" fill="#0B1E3D">DP2 — cross a security boundary without weakening it. &#160;·&#160; DP1 — verify, don't trust.</text>
  <text x="228" y="772" font-size="9" fill="#334155">This rung never leaves the institution: the computation is entirely classical and runs on Laguna, and the geometry it consumes was never uploaded to SOLANGE at all. Only the sealed</text>
  <text x="228" y="785" font-size="9" fill="#334155">verdict crosses back — whether an agent pulled the job or a researcher submitted it by hand with sbatch. How the work was started changes nothing about how its result is admitted.</text>
</svg>
